apiVersion: v1
kind: ServiceAccount
metadata:
  name: snyk-dispatcher
  namespace: eventus
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: snyk-dispatcher-jobs
  namespace: eventus
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: snyk-dispatcher-jobs-binding
  namespace: eventus
subjects:
  - kind: ServiceAccount
    name: snyk-dispatcher
    namespace: eventus
roleRef:
  kind: Role
  name: snyk-dispatcher-jobs
  apiGroup: rbac.authorization.k8s.io
