apiVersion: apps/v1
kind: Deployment
metadata:
  name: snyk-dispatcher
  namespace: eventus
spec:
  replicas: 2
  selector:
    matchLabels:
      app: snyk-dispatcher
  template:
    metadata:
      labels:
        app: snyk-dispatcher
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "snyk-dispatcher"
        # Renders a sourceable env file at /vault/secrets/config from the
        # kv-v2 secret at secret/snyk-scanner/dispatcher (rabbitmq_url, database_url).
        vault.hashicorp.com/agent-inject-secret-config: "secret/data/snyk-scanner/dispatcher"
        vault.hashicorp.com/agent-inject-template-config: |
          {{- with secret "secret/data/snyk-scanner/dispatcher" }}
          export RABBITMQ_URL="{{ .Data.data.rabbitmq_url }}"
          export DATABASE_URL="{{ .Data.data.database_url }}"
          {{- end }}
    spec:
      serviceAccountName: snyk-dispatcher
      imagePullSecrets:
        - name: harbor-pull-secret
      containers:
        - name: dispatcher
          image: harbor.internal.example.com/snyk-scanner/dispatcher:latest
          command: ["/bin/sh", "-c"]
          args:
            - ". /vault/secrets/config && exec python3 main.py"
          env:
            - name: K8S_NAMESPACE
              value: eventus
            - name: JOB_IMAGE_PREFIX
              value: harbor.internal.example.com/snyk-scanner/scan-job
            - name: ALLOWED_GIT_HOSTS
              value: "git.internal.example.com"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
