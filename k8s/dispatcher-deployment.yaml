apiVersion: apps/v1
kind: Deployment
metadata:
  name: snyk-dispatcher
  namespace: snyk-scanner
spec:
  replicas: 2
  selector:
    matchLabels:
      app: snyk-dispatcher
  template:
    metadata:
      labels:
        app: snyk-dispatcher
    spec:
      serviceAccountName: snyk-dispatcher
      containers:
        - name: dispatcher
          image: ghcr.io/example/snyk-dispatcher:latest
          env:
            - name: K8S_NAMESPACE
              value: snyk-scanner
            - name: JOB_IMAGE_PREFIX
              value: ghcr.io/example/snyk-scan-job
            - name: ALLOWED_GIT_HOSTS
              value: "github.com,gitlab.com"
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-credentials
                  key: url
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: scan-db-credentials
                  key: url
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
